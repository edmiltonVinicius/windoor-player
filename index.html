<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Totem - Atacadão</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background: #000;
    }
    #oferta { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #oferta img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #status { position: fixed; bottom: 8px; right: 8px; color: #555; font-family: sans-serif; font-size: 12px; z-index: 20; }

    /* Tela de fallback "branded": só aparece quando não há ofertas nem da
       API nem do cache local (ex: primeira execução do totem sem internet).
       Sem assets de marca disponíveis ainda, usa um placeholder simples com
       as cores do Atacadão (azul + vermelho) em vez de tela branca/preta. */
    #fallback {
      display: none;
      width: 100%; height: 100%;
      flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #003DA5 0%, #001B45 100%);
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    #fallback .logo-placeholder {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: #E30613;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 22px; letter-spacing: 1px;
      margin-bottom: 24px;
    }
    #fallback .titulo { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
    #fallback .subtitulo { font-size: 16px; opacity: 0.85; max-width: 480px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="oferta"></div>
  <div id="fallback">
    <div class="logo-placeholder">ATC</div>
    <div class="titulo">Estamos atualizando as ofertas</div>
    <div class="subtitulo">Não foi possível carregar as ofertas no momento. O totem vai continuar tentando se reconectar automaticamente.</div>
  </div>
  <div id="status">conectando...</div>

  <!-- Biblioteca do WebSocket -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Módulos do player, nessa ordem: config primeiro, app.js por último -->
  <script src="config.js"></script>
  <script src="cache.js"></script>
  <script src="render.js"></script>
  <script src="logger.js"></script>
  <script src="heartbeat.js"></script>
  <script src="commands.js"></script>
  <script src="proof-of-play.js"></script>
  <script src="wakelock.js"></script>
  <script src="watchdog.js"></script>
  <script src="app.js"></script>
</body>
</html>
